{% extends 'base.html' %} <!-- Adjust to your base template if needed -->

{% block content %}
<div class="container" style="max-width: 450px; margin: 40px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
    <h2>Forgot Password?</h2>
    <p>Enter your UWM email address below and we'll send you a link to reset your password.</p>

    {% if error %}
        <div style="color: red; margin-bottom: 15px;">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label for="email" style="display: block; margin-bottom: 5px;">Email Address</label>
            <input type="email" id="email" name="email" required style="width: 100%; padding: 8px; box-sizing: border-box;" placeholder="username@uwm.edu">
        </div>

        <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
            Send Reset Link
        </button>
    </form>

    <div style="margin-top: 15px; text-align: center;">
        <a href="{% url 'login' %}">Back to Login</a>
    </div>
</div>
{% endblock %}

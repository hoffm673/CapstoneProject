{% extends 'base.html' %} <!-- Adjust to your base template if needed -->

{% block content %}
<div class="container" style="max-width: 450px; margin: 40px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
    <h2>Set New Password</h2>

    {% if error %}
        <div style="color: red; margin-bottom: 15px;">{{ error }}</div>
    {% else %}
        <form method="POST">
            {% csrf_token %}
            <div style="margin-bottom: 15px;">
                <label for="password" style="display: block; margin-bottom: 5px;">New Password</label>
                <input type="password" id="password" name="password" required style="width: 100%; padding: 8px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="password_confirm" style="display: block; margin-bottom: 5px;">Confirm New Password</label>
                <input type="password" id="password_confirm" name="password_confirm" required style="width: 100%; padding: 8px; box-sizing: border-box;">
            </div>

            <button type="submit" style="width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">
                Reset Password
            </button>
        </form>
    {% endif %}

    <div style="margin-top: 15px; text-align: center;">
        <a href="{% url 'login' %}">Back to Login</a>
    </div>
</div>
{% endblock %}

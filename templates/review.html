{% extends "base.html" %}
{% load static %}

{% block title %}Submit A Review{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow p-4" style="width: 100%; max-width: 600px;">

        <h2 class="text-center mb-4">Submit A Review</h2>

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        {% if success %}
            <div class="alert alert-success">
                {{ success }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label for="course" class="form-label">Course</label>
                <select id="course" name="course" required></select>
            </div>

            <div class="mb-3">
                <label for="professor" class="form-label">Professor</label>
                <select class="form-select" id="professor" name="professor" required>
                    <option value="" selected disabled>Select a professor</option>
                    {% for professor in professors %}
                        <option value="{{ professor.id }}">{{ professor.professor_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="row mb-3">
                <div class="col">
                    <label for="difficulty_score" class="form-label">Difficulty (1-5)</label>
                    <select class="form-select" id="difficulty_score" name="difficulty_score" required>
                        <option value="" selected disabled>Rate it</option>
                        {% for i in "12345" %}
                            <option value="{{ i }}">{{ i }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col">
                    <label for="time_score" class="form-label">Time Commitment (1-5)</label>
                    <select class="form-select" id="time_score" name="time_score" required>
                        <option value="" selected disabled>Rate it</option>
                        {% for i in "12345" %}
                            <option value="{{ i }}">{{ i }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="review_text" class="form-label">Your Review</label>
                <textarea
                    class="form-control"
                    id="review_text"
                    name="review_text"
                    rows="5"
                    placeholder="What was the course like? Any tips for future students?"
                    required
                ></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Submit Review
            </button>

        </form>

    </div>

</div>
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

<style>
    /* Keep the results list short so it doesn't cover the rest of the form */
    .ts-dropdown .ts-dropdown-content { max-height: 180px; }
</style>

<script>
    new TomSelect('#course', {
        valueField: 'id',
        labelField: 'label',
        placeholder: 'Search for a course...',
        maxOptions: 5,
        loadThrottle: 250,
        score: function () { return function () { return 1; }; },
        sortField: '$order',
        load: function (query, callback) {
            if (!query.length) return callback();   // wait until they type something
            this.clearOptions();
            fetch(`{% url 'course_lookup' %}?q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => callback(data.results))
                .catch(() => callback());
        }
    });
</script>

{% endblock %}
